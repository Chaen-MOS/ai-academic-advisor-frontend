<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=390, height=884, initial-scale=1.0" name="viewport">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-container-highest": "#dce4e4",
                        "on-tertiary-fixed": "#2d1600",
                        "outline-variant": "#bdc8ce",
                        "secondary": "#576060",
                        "on-secondary-container": "#5b6464",
                        "inverse-surface": "#2a3232",
                        "on-secondary-fixed-variant": "#3f4948",
                        "on-tertiary-fixed-variant": "#6a3b00",
                        "on-secondary": "#ffffff",
                        "on-error-container": "#93000a",
                        "background": "#F8FCFD",
                        "surface-container-low": "#edf5f5",
                        "surface": "#f3fbfa",
                        "tertiary-fixed": "#ffdcbf",
                        "primary-container": "#15a9d1",
                        "on-surface-variant": "#3d484e",
                        "tertiary-container": "#db892f",
                        "surface-variant": "#dce4e4",
                        "on-surface": "#151d1d",
                        "on-primary-fixed-variant": "#004d62",
                        "secondary-container": "#d8e2e1",
                        "on-primary": "#ffffff",
                        "surface-dim": "#d3dcdb",
                        "secondary-fixed-dim": "#bfc8c8",
                        "tertiary-fixed-dim": "#ffb873",
                        "outline": "#6d797e",
                        "on-tertiary-container": "#4f2b00",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "inverse-primary": "#5bd4fe",
                        "surface-bright": "#f3fbfa",
                        "primary-fixed-dim": "#5bd4fe",
                        "error-container": "#ffdad6",
                        "surface-container-high": "#e2eae9",
                        "on-background": "#151d1d",
                        "secondary-fixed": "#dbe4e4",
                        "inverse-on-surface": "#eaf2f2",
                        "surface-tint": "#006781",
                        "on-secondary-fixed": "#141d1d",
                        "surface-container": "#e7efef",
                        "primary": "#006781",
                        "error": "#ba1a1a",
                        "on-primary-fixed": "#001f29",
                        "on-primary-container": "#003948",
                        "primary-fixed": "#b9eaff",
                        "on-error": "#ffffff",
                        "tertiary": "#8c5000",
                        "brand-blue": "#12AEEA",
                        "brand-accent": "#72D7F0",
                        "input-label": "#667171",
                        "input-hint": "#9A9FA0",
                        "input-line": "#575D5D",
                        "input-value": "#8E9696",
                        "text-main": "#384343"
                    },
                    borderRadius: {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "button": "15px",
                        "full": "0.75rem"
                    },
                    spacing: {
                        "unit": "4px",
                        "container-padding": "24px"
                    },
                    fontFamily: {
                        "welcome-text": ["Inter"],
                        "button-label": ["Inter"],
                        "welcome-text-mobile": ["Inter"],
                        "ui-element": ["Inter"],
                        "body-main": ["Inter"]
                    },
                    fontSize: {
                        "title-custom": ["26px", "32px"],
                        "label-custom": ["16px", "20px"],
                        "hint-custom": ["12px", "16px"]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #F8FCFD;
            width: 390px;
            height: 884px;
            margin: 0 auto;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            position: relative;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        input:focus {
            outline: none;
        }
        .custom-radio {
            width: 12px;
            height: 12px;
            border: 1px solid #7E8585;
            border-radius: 50%;
            display: inline-block;
        }
        .underline-accent {
            width: 145px;
            height: 2px;
            background-color: #72D7F0;
            margin-top: 6px;
        }
    </style>
</head>
<body class="text-on-background">
<!-- 1. Top Image -->
<div class="w-full h-[275px] absolute top-0 left-0 bg-surface-container-highest overflow-hidden">
<img class="w-full h-full object-cover" data-alt="A clean, academic-themed high-resolution photography image featuring a bright, modern university workspace. A minimalist desk with a sleek laptop, a leather-bound journal, and a ceramic mug sits under soft morning sunlight filtering through a large window. The color palette is dominated by airy light blues and pristine whites, echoing a professional and focused learning environment. The mood is serene, intellectual, and highly organized." src="https://lh3.googleusercontent.com/aida-public/AB6AXuB1dQ93xVCKTVyKuWOpnklWYRdT-jnwr3gr1puhnnkZ-NK6ryYlChTWq9Vqfa1M2sa3C5YMOOpYhWds_KElHti_NUe8v3GF1VOEYHRaQFvZuIRMeqt9-bUFc5Qb981EaHUN_SSxzTHzUz0k5NwofxNkONI1IP6hY9YycTDLg9sxu0KP8YR79z_sCJadH6Ci5OuoAV0pEuMCZAIz_D_daCGj2Swqk9q5YiFUoyC1V6c2KpgAI1lbesrK">
</div>
<!-- Main Content Wrapper -->
<div class="absolute top-[305px] w-full px-container-padding flex flex-col h-[579px]">
<!-- 3. Title -->
<div class="mb-8">
<h1 class="font-welcome-text text-[26px] font-bold text-[#384343] tracking-tight">Create Account</h1>
<div class="underline-accent"></div>
</div>
<!-- Form Area -->
<div class="flex flex-col gap-6">
<!-- 4. Username Input -->
<div class="flex flex-col">
<label class="text-[16px] text-[#667171] font-medium mb-1">Username</label>
<input class="bg-transparent border-none p-0 text-[12px] placeholder-[#9A9FA0] text-[#151d1d] focus:ring-0" placeholder="Enter your username" type="text">
<div class="w-[342px] h-[1px] bg-[#575D5D] mt-1"></div>
</div>
<!-- 5. Email Input -->
<div class="flex flex-col">
<label class="text-[16px] text-[#667171] font-medium mb-1">Email</label>
<input class="bg-transparent border-none p-0 text-[12px] text-[#8E9696] focus:ring-0" type="email" value="123@gmail.com">
<div class="w-[342px] h-[1px] bg-[#575D5D] mt-1"></div>
</div>
<!-- 6. Mobile Number Input -->
<div class="flex flex-col">
<label class="text-[16px] text-[#667171] font-medium mb-1">Mobile Number</label>
<input class="bg-transparent border-none p-0 text-[12px] placeholder-[#9A9FA0] text-[#151d1d] focus:ring-0" placeholder="Enter your mobile" type="tel">
<div class="w-[342px] h-[1px] bg-[#575D5D] mt-1"></div>
</div>
<!-- 7. Password Input -->
<div class="flex flex-col">
<label class="text-[16px] text-[#667171] font-medium mb-1">Password</label>
<input class="bg-transparent border-none p-0 text-[12px] placeholder-[#9A9FA0] text-[#151d1d] focus:ring-0" placeholder="Enter your password" type="password">
<div class="w-[342px] h-[1px] bg-[#575D5D] mt-1"></div>
</div>
<!-- 8. Terms -->
<div class="flex items-center gap-2 mt-2 cursor-pointer" onclick="this.querySelector('.custom-radio').classList.toggle('bg-brand-blue')">
<div class="custom-radio transition-colors duration-200"></div>
<span class="text-[12px] text-[#555D5D]">Agree with Terms &amp; Conditions</span>
</div>
</div>
<!-- 9. Vertical Space -->
<div class="flex-grow"></div>
<!-- 10. Sign Up Button -->
<div class="pb-[57px] flex justify-center">
<button class="w-[302px] h-[52px] bg-[#B2FFFF] rounded-[15px] text-black text-[16px] font-bold shadow-sm active:scale-[0.98] transition-transform flex items-center justify-center">
                Sign Up
            </button>
</div>
</div>
<!-- Subtle atmospheric effect (Client-side micro-interaction) -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('input');
            inputs.forEach(input => {
                input.addEventListener('focus', () => {
                    const line = input.nextElementSibling;
                    line.style.backgroundColor = '#12AEEA';
                    line.style.height = '1.5px';
                    line.style.transition = 'all 0.3s ease';
                });
                input.addEventListener('blur', () => {
                    const line = input.nextElementSibling;
                    line.style.backgroundColor = '#575D5D';
                    line.style.height = '1px';
                });
            });
        });
    </script>


</body></html>
