<!DOCTYPE html><html class="light" lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-dim": "#d3dcdb",
                    "on-secondary-container": "#5b6464",
                    "on-tertiary-container": "#4f2b00",
                    "surface-container-high": "#e2eae9",
                    "surface-tint": "#006781",
                    "inverse-on-surface": "#eaf2f2",
                    "secondary-fixed-dim": "#bfc8c8",
                    "surface-container-low": "#edf5f5",
                    "inverse-surface": "#2a3232",
                    "tertiary": "#8c5000",
                    "surface-bright": "#f3fbfa",
                    "on-secondary-fixed-variant": "#3f4948",
                    "outline-variant": "#bdc8ce",
                    "tertiary-fixed-dim": "#ffb873",
                    "surface": "#f3fbfa",
                    "primary-fixed": "#b9eaff",
                    "on-secondary": "#ffffff",
                    "on-error-container": "#93000a",
                    "on-secondary-fixed": "#141d1d",
                    "on-tertiary-fixed": "#2d1600",
                    "on-tertiary": "#ffffff",
                    "on-primary-fixed": "#001f29",
                    "error": "#ba1a1a",
                    "tertiary-container": "#db892f",
                    "surface-container-lowest": "#ffffff",
                    "primary": "#006781",
                    "on-tertiary-fixed-variant": "#6a3b00",
                    "secondary": "#576060",
                    "on-primary": "#ffffff",
                    "inverse-primary": "#5bd4fe",
                    "surface-variant": "#dce4e4",
                    "background": "#f3fbfa",
                    "surface-container-highest": "#dce4e4",
                    "primary-fixed-dim": "#5bd4fe",
                    "error-container": "#ffdad6",
                    "tertiary-fixed": "#ffdcbf",
                    "secondary-fixed": "#dbe4e4",
                    "on-surface-variant": "#3d484e",
                    "primary-container": "#15a9d1",
                    "outline": "#6d797e",
                    "on-primary-container": "#003948",
                    "on-primary-fixed-variant": "#004d62",
                    "secondary-container": "#d8e2e1",
                    "on-surface": "#151d1d",
                    "on-error": "#ffffff",
                    "on-background": "#151d1d",
                    "surface-container": "#e7efef",
                    "brand-cyan": "#B2FFFF"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem",
                    "login-btn": "16px"
            },
            "spacing": {
                    "unit": "4px",
                    "input-height": "40px",
                    "max-content-width": "800px",
                    "element-gap": "12px",
                    "container-padding": "24px"
            },
            "fontFamily": {
                    "welcome-text-mobile": ["Inter"],
                    "welcome-text": ["Inter"],
                    "body-main": ["Inter"],
                    "ui-element": ["Inter"],
                    "button-label": ["Inter"]
            },
            "fontSize": {
                    "welcome-text-mobile": ["18px", {"lineHeight": "24px", "fontWeight": "700"}],
                    "welcome-text": ["20px", {"lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                    "body-main": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "ui-element": ["11px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "400"}],
                    "button-label": ["11px", {"lineHeight": "14px", "fontWeight": "600"}],
                    "title-custom": ["31px", {"lineHeight": "38px", "fontWeight": "400"}],
                    "label-custom": ["15px", {"lineHeight": "20px"}],
                    "input-custom": ["14px", {"lineHeight": "18px"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            background-color: #F8FCFD;
            height: 100vh;
            overflow: hidden;
            margin: 0;
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        input:focus {
            outline: none;
        }
        .underline-accent {
            width: 92px;
            height: 2px;
            background-color: #B2FFFF;
            margin-top: 5px;
        }
        .login-layout {
            display: grid;
            grid-template-rows: 32vh 1fr auto;
            height: 100vh;
        }
        .bottom-border-field {
            border-bottom: 1px solid #555555;
        }
    </style>
</head>
<body class="text-on-surface">
<div class="login-layout relative">
<!-- Top Section: Image Placeholder -->
<div class="w-full h-full overflow-hidden">
<div class="w-full h-full bg-cover bg-center" data-alt="A clean, minimalist high-key architectural photograph of a university library with bright cyan architectural accents. The space is flooded with soft, natural light, emphasizing sharp lines and clinical organization. The overall aesthetic is one of high-minimalism, combining sterile white surfaces with a single pop of light cyan color. The composition is wide and cinematic, conveying academic focus and quiet efficiency." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDX5erY1Q5daBdYtfNC3zUOyjBPyRiMGxfrl4tL9HHMQz1qrzPLQy-wM8okOjmRwvUKyQ066rAXt78irEhrV04CSXw1yXv4hOBukhOMudo2aKTZkg5dD7QQPe_59KvOLi6txZ_J6C5Onduy7V5b7jbuvSojG5k0da_OzGR4Yy2_N5eDibJZd3eZyhp-Q0vx3bdZdyIswqqROAY8Kz4Wz53vyTw7K9hAqGefi7sfWwDA9k78OFZFr-kd')"></div>
</div>
<!-- Content Area -->
<main class="flex flex-col pt-[20px] px-[24px]">
<!-- Title -->
<div class="mb-8">
<h1 class="text-title-custom text-[#252525]">Sign in</h1>
<div class="underline-accent" style="background-color: rgb(17, 174, 234);"></div>
</div>
<!-- Email Field -->
<div class="mb-6">
<label class="block text-label-custom text-[#666666] mb-1">Email</label>
<input class="w-full bg-transparent border-none p-0 pb-1 text-input-custom text-[#333333] bottom-border-field focus:ring-0" type="text" value="dddd">
</div>
<!-- Password Field -->
<div class="mb-[13px]">
<label class="block text-label-custom text-[#666666] mb-1">Password</label>
<div class="relative w-full bottom-border-field">
<input class="w-full bg-transparent border-none p-0 pb-1 text-input-custom text-[#333333] focus:ring-0" style="letter-spacing: 0.2em;" type="password" value="password">
</div>
</div>
<!-- Auxiliary Row -->
<div class="flex justify-between items-center w-full">
<!-- Remember Me -->
<button class="flex items-center gap-2 focus:outline-none group">
<div class="w-[12px] h-[12px] rounded-full bg-brand-cyan" style="background-color: rgb(17, 174, 234);"></div>
<span class="text-[12px] text-[#242424]">Remember Me</span>
</button>
<!-- Forgot Password -->
<a class="text-[13px] font-semibold text-brand-cyan focus:outline-none" href="#" style="color: rgb(17, 174, 234);">Forgot Password?</a>
</div>
<!-- Large Whitespace implicitly handled by layout grid and bottom pinning -->
</main>
<!-- Footer / Action Area -->
<footer class="flex flex-col items-center pb-[16px] w-full">
<!-- Login Button -->
<button class="w-[84%] h-[54px] bg-brand-cyan rounded-login-btn flex items-center justify-center mb-[11px] active:opacity-90 transition-opacity" style="background-color: rgb(178, 255, 255);">
<span class="text-[16px] font-semibold text-[#000000]">Login</span>
</button>
<!-- Sign Up Hint -->
<div class="flex items-center gap-1">
<span class="text-[12px] text-[#777777]">Don't have an Account?</span>
<a class="text-[12px] font-bold text-brand-cyan" href="#" style="color: #11AEEA;">Sign Up</a>
</div>
</footer>
</div>
<script>
        // Micro-interaction for Remember Me toggle
        const rememberBtn = document.querySelector('button.flex.items-center.gap-2');
        let isRemembered = true;
        
        rememberBtn.addEventListener('click', () => {
            isRemembered = !isRemembered;
            const indicator = rememberBtn.querySelector('div');
            if (isRemembered) {
                indicator.style.backgroundColor = '#B2FFFF';
            } else {
                indicator.style.backgroundColor = '#dce4e4';
            }
        });

        // Simple input focus behavior logic
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.style.borderBottomColor = '#15a9d1';
            });
            input.addEventListener('blur', () => {
                input.parentElement.style.borderBottomColor = '#555555';
            });
        });
    </script>
</body></html>
