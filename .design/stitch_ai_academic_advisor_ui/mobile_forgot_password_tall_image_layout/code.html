<style>
    body {
      background-color: #F8FBFD;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      height: 100vh;
      overflow: hidden;
    }

    /* Fixed Canvas constraint */
    .mobile-canvas {
      width: 390px;
      height: 884px;
      background-color: #F8FBFD;
      position: relative;
      overflow: hidden;
    }

    .brand-card {
      background-color: #2E348C;
      box-shadow: 0 8px 30px rgba(46, 52, 140, 0.15);
    }

    .custom-input-line {
      border-bottom: 1px solid #7079B8;
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    /* Override for reset button text case integrity */
    .btn-reset-text {
      font-size: 11px;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body class="antialiased">
<main class="mobile-canvas">
<!-- TOP IMAGE AREA -->
<div class="absolute top-0 left-0 w-full h-[300px] overflow-hidden">
<img alt="Student in library" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida/AP1WRLsE7AS40R6fhC01VfsHn7HZBNbYdrmDbcTeqcCmNRq03Jm3k-hgNY4Rh3P1TFUQ_c5iU-alDdZ-_q2Jgbr0N-BySCzMgez9f6figNOPBy9D19dSwD0WCgFlqzJG9KtK7Huv2W9SMcLvg85BnePA81tqHnRbKX0EMdKPQo97ViHv43zwX0401qU68cvEPhb8cYArDydY9g4eorYd_81q1rlcsHd8n0t2fWskhdsZ7RWXPe33TOagqtW6Cq0">
</div>
<!-- FORGOT PASSWORD CARD -->
<div class="brand-card absolute top-[175px] left-[44px] w-[302px] rounded-[4px] px-[16px] py-[18px] flex flex-col z-10 h-[300px]">
<!-- Title -->
<h1 class="text-white text-[24px] font-bold text-center">Forgot your password</h1>
<!-- Description -->
<p class="text-[#EDEFFF] text-[14px] leading-[20px] font-normal text-center mt-[10px]">Please enter the email address you would like your password reset information sent to.</p>
<!-- Email Field Container -->
<div class="flex flex-col w-full mt-[32px]">
<label class="text-[#E8ECFF] font-semibold text-left mb-1" for="email" style="font-size: 18px;">
          Enter email address
        </label>
<div class="flex items-center w-full">
<input class="bg-transparent border-none p-0 w-full text-[#AEB5D9] text-[11px] font-normal focus:ring-0 focus:outline-none placeholder-[#AEB5D9]/50" id="email" type="email" value="123@gmail.com" style="font-size: 15px;">
</div>
<!-- Divider -->
<div class="w-full h-[1px] bg-[#7079B8] mt-1"></div>
</div>
<!-- Reset Button (Spacer to push to bottom) -->
<div class="mt-auto">
<button class="w-full h-[38px] bg-white rounded-[2px] flex items-center justify-center hover:bg-white/90 transition-colors duration-200" style="transform: scale(1);">
<span class="text-[#2E348C] font-bold btn-reset-text">REQUEST RESET LINK</span>
</button>
</div>
</div>
<!-- BACK LINK -->
<div class="absolute left-0 w-full flex justify-center top-[500px]">
<a class="flex items-center gap-1 text-[#24308A] font-bold text-[14px] hover:underline transition-all" href="#">
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'wght' 700;">chevron_left</span>
        Back to Sign in
      </a>
</div>
<!-- Empty lower portion as requested -->
<div class="absolute bottom-0 w-full h-[300px]"></div>
</main>
<script>
    // Micro-interaction for the input field focus
    const emailInput = document.getElementById('email');
    const divider = emailInput.closest('div').nextElementSibling;

    emailInput.addEventListener('focus', () => {
      divider.style.backgroundColor = '#FFFFFF';
      divider.style.height = '1.5px';
    });

    emailInput.addEventListener('blur', () => {
      divider.style.backgroundColor = '#7079B8';
      divider.style.height = '1px';
    });

    // Simple interaction for the reset button
    const resetButton = document.querySelector('button');
    resetButton.addEventListener('mousedown', () => {
      resetButton.style.transform = 'scale(0.98)';
    });
    resetButton.addEventListener('mouseup', () => {
      resetButton.style.transform = 'scale(1)';
    });
    resetButton.addEventListener('mouseleave', () => {
      resetButton.style.transform = 'scale(1)';
    });
  </script>


</body></html>
