<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>AI Academic Advisor</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "primary-fixed-dim": "#5bd4fe",
                    "outline-variant": "#bdc8ce",
                    "surface": "#f3fbfa",
                    "on-secondary-fixed": "#141d1d",
                    "surface-variant": "#dce4e4",
                    "tertiary-fixed": "#ffdcbf",
                    "on-primary-fixed-variant": "#004d62",
                    "inverse-surface": "#2a3232",
                    "inverse-primary": "#5bd4fe",
                    "on-error-container": "#93000a",
                    "primary-fixed": "#b9eaff",
                    "error-container": "#ffdad6",
                    "on-secondary-fixed-variant": "#3f4948",
                    "tertiary": "#8c5000",
                    "on-surface": "#151d1d",
                    "inverse-on-surface": "#eaf2f2",
                    "secondary-container": "#d8e2e1",
                    "background": "#f3fbfa",
                    "on-tertiary": "#ffffff",
                    "surface-container-high": "#e2eae9",
                    "on-tertiary-fixed": "#2d1600",
                    "on-primary": "#ffffff",
                    "on-secondary": "#ffffff",
                    "surface-container-low": "#edf5f5",
                    "on-tertiary-fixed-variant": "#6a3b00",
                    "secondary": "#576060",
                    "secondary-fixed-dim": "#bfc8c8",
                    "surface-dim": "#d3dcdb",
                    "on-tertiary-container": "#4f2b00",
                    "on-secondary-container": "#5b6464",
                    "on-primary-container": "#003948",
                    "surface-tint": "#006781",
                    "outline": "#6d797e",
                    "surface-container-highest": "#dce4e4",
                    "secondary-fixed": "#dbe4e4",
                    "surface-container-lowest": "#ffffff",
                    "on-primary-fixed": "#001f29",
                    "tertiary-fixed-dim": "#ffb873",
                    "primary": "#006781",
                    "tertiary-container": "#db892f",
                    "surface-container": "#e7efef",
                    "on-surface-variant": "#3d484e",
                    "primary-container": "#15a9d1",
                    "on-background": "#151d1d",
                    "error": "#ba1a1a",
                    "surface-bright": "#f3fbfa",
                    "on-error": "#ffffff",
                    "brand-canvas": "#B2FFFF"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem",
                    "input": "9px"
            },
            "spacing": {
                    "container-padding": "24px",
                    "max-content-width": "800px",
                    "input-height": "40px",
                    "unit": "4px",
                    "element-gap": "12px"
            },
            "fontFamily": {
                    "welcome-text-mobile": ["Inter", "sans-serif"],
                    "welcome-text": ["Inter", "sans-serif"],
                    "ui-element": ["Inter", "sans-serif"],
                    "body-main": ["Inter", "sans-serif"],
                    "button-label": ["Inter", "sans-serif"]
            },
            "fontSize": {
                    "welcome-text-mobile": ["18px", {"lineHeight": "24px", "fontWeight": "700"}],
                    "welcome-text": ["20px", {"lineHeight": "1.35", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                    "ui-element": ["11px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "400"}],
                    "body-main": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "button-label": ["11px", {"lineHeight": "14px", "fontWeight": "600"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            background-color: #B2FFFF;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="flex flex-col h-screen w-screen relative" style="background-color: #FFFFFF;">
<!-- Top Bar Navigation (Based on TopAppBar Shared Component logic) -->
<header class="absolute top-0 left-0 w-full flex justify-between items-center z-50" style="background-color: rgb(178, 255, 255); height: 50px; padding-left: 18px; padding-right: 18px;">
<button class="hover:opacity-70 transition-opacity active:scale-90 transition-transform">
<span class="material-symbols-outlined text-[#080808]" style="font-size: 20px;">menu</span>
</button>
<button class="hover:opacity-70 transition-opacity active:scale-90 transition-transform">
<span class="material-symbols-outlined text-[#080808]" style="font-size: 20px;">notifications</span>
</button>
</header>
<!-- Welcome Text - Centered at 42% height -->
<main class="flex-grow flex flex-col items-center justify-start"><div class="mt-[36vh] flex flex-col items-center px-6"><h1 class="font-welcome-text text-[24px] font-bold text-[#1D2626] text-center leading-tight">How can I help you<br>today?</h1><p class="text-[#777777] text-[14px] text-center mt-[10px]">Ask anything about your academic journey.</p></div></main>
<!-- Footer Area (Quick Actions & Input Box) -->
<footer class="w-full max-w-max-content-width mx-auto px-4 flex flex-col items-center">
<!-- Quick Buttons Group -->
<div class="grid grid-cols-2 gap-[12px] px-5 mb-[40px] w-full"><button class="bg-[#B2FFFF] rounded-[16px] p-3 flex items-center justify-between gap-2 hover:opacity-80 transition-opacity active:scale-95 h-full"><span class="text-[12px] text-[#1D2626] text-left leading-tight">Attendance issue</span><span class="material-symbols-outlined text-[#1D2626]" style="font-size: 14px;">send</span></button><button class="bg-[#B2FFFF] rounded-[16px] p-3 flex items-center justify-between gap-2 hover:opacity-80 transition-opacity active:scale-95 h-full"><span class="text-[12px] text-[#1D2626] text-left leading-tight">How to apply for leave?</span><span class="material-symbols-outlined text-[#1D2626]" style="font-size: 14px;">send</span></button><button class="bg-[#B2FFFF] rounded-[16px] p-3 flex items-center justify-between gap-2 hover:opacity-80 transition-opacity active:scale-95 h-full"><span class="text-[12px] text-[#1D2626] text-left leading-tight">Recommended courses for next semester</span><span class="material-symbols-outlined text-[#1D2626]" style="font-size: 14px;">send</span></button><button class="bg-[#B2FFFF] rounded-[16px] p-3 flex items-center justify-between gap-2 hover:opacity-80 transition-opacity active:scale-95 h-full"><span class="text-[12px] text-[#1D2626] text-left leading-tight">View my timetable</span><span class="material-symbols-outlined text-[#1D2626]" style="font-size: 14px;">send</span></button></div>
<!-- Input Box -->
<div class="w-full h-[48px] bg-[#B2FFFF] rounded-[16px] flex items-center px-4 relative mb-4"><input class="w-full h-full bg-transparent border-none focus:ring-0 text-[13px] text-[#1D2626] placeholder-[#8A9292] p-0" placeholder="Type your question..." type="text"><button class="flex items-center justify-center ml-2 hover:opacity-70 active:scale-90 transition-all"><span class="material-symbols-outlined text-[#080808]" style="font-size: 20px; font-variation-settings: 'FILL' 1;">send</span></button></div>
</footer>
<!-- Micro-interaction for buttons -->
<script>
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', function(e) {
                // Logic for selecting a quick prompt can be added here
                const text = this.querySelector('span:first-child')?.innerText;
                const input = document.querySelector('input');
                if (text && input && !this.querySelector('.text-[#080808]')) {
                    input.value = text;
                    input.focus();
                }
            });
        });
    </script>


</body></html>
